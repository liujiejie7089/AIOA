# 模型 provider 配置（模型网关唯一数据源）
#
# 双模式切换说明：
#   - 云端模式：把 default_chat 指向 qwen-cloud / deepseek，并在环境变量里配置对应
#     *_API_KEY 与 *_BASE_URL（密钥一律走 env，不写进本文件）。
#   - 本地模式：把 default_chat 指向 local-vllm / local-ollama，base_url 填容器内网地址，
#     无需出网，适合私有化部署。
#   - 回声模式（M1 默认）：default_chat: echo，不发起任何模型调用，仅逐字符回显，
#     用于打通链路与联调 SSE 协议。
#
# default_chat 支持环境变量覆盖：MODEL_DEFAULT=<下面任一 key>

default_chat: echo

providers:
  # ---- 内置回声 provider：本地内置，零依赖，M1 骨架默认 ----
  echo:
    type: local
    driver: echo
    base_url: ""
    model: echo-1
    api_key_env: ""          # 不需要密钥
    enabled: true
    remark: 内置回声，直接可用，不发起网络请求

  # ---- 云端：通义千问（DashScope 兼容 OpenAI 接口）----
  qwen-cloud:
    type: cloud
    driver: openai_compatible
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    api_key_env: QWEN_API_KEY
    enabled: false
    remark: 云端模式，需配置 QWEN_API_KEY

  # ---- 云端：DeepSeek（OpenAI 兼容接口）----
  deepseek:
    type: cloud
    driver: openai_compatible
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    enabled: false
    remark: 云端模式，需配置 DEEPSEEK_API_KEY

  # ---- 本地：vLLM（OpenAI 兼容接口，GPU 推理）----
  local-vllm:
    type: local
    driver: openai_compatible
    base_url: http://aioa-vllm:8000/v1
    model: qwen2.5-7b-instruct
    api_key_env: ""          # 本地部署通常无需密钥
    enabled: false
    remark: 本地模式，容器内网可达，无需出网

  # ---- 本地：Ollama（本机/内网推理）----
  local-ollama:
    type: local
    driver: openai_compatible
    base_url: http://aioa-ollama:11434/v1
    model: qwen2.5:7b
    api_key_env: ""
    enabled: false
    remark: 本地模式，容器内网可达，无需出网
