[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aioa-agent"
version = "0.1.0"
description = "AIOA Python agent service (M1 skeleton, echo mode)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "faster-whisper>=1.0",
    # ★ 必须钉住：PyAV 19 移除了 faster-whisper 仍在用的 metadata_errors 参数，
    #   装上 av>=19 会在第一个请求上炸：
    #   TypeError: open() got an unexpected keyword argument 'metadata_errors'
    "av>=14,<19",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
