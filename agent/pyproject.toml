[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aioa-agent"
version = "0.1.0"
description = "AIOA Python agent service (M1 skeleton, echo mode)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pytest>=8.0",
    "faster-whisper>=1.0",
    # ★ 必须钉住：PyAV 19 移除了 faster-whisper 仍在用的 metadata_errors 参数，
    #   装上 av>=19 会在第一个请求上炸：
    #   TypeError: open() got an unexpected keyword argument 'metadata_errors'
    "av>=14,<19",
]

[tool.setuptools.packages.find]
# ★ 必须同时包含 aioa_ai：AI 能力已整体迁到 aioa_ai，app/ 只是 HTTP 接入层 + 兼容垫片。
#   只写 ["app*"] 时 `pip install .`（**非 editable**，即镜像构建）产出的 wheel 里
#   **没有 aioa_ai**，容器按 CMD 起 uvicorn 时 `app/main.py:14 from aioa_ai import entry`
#   直接 ModuleNotFoundError → 容器起不来。
#   本地之所以看不出来：`uvicorn`/`python -m` 会把 cwd（agent/）放进 sys.path，
#   aioa_ai 恰好就在 cwd 下，掩盖了打包缺失。
#   判据：python -m pip install --target /tmp/x . 后 /tmp/x 下必须同时有 app/ 与 aioa_ai/。
include = ["app*", "aioa_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
