server:
  port: 8080

spring:
  application:
    name: aioa-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aioa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: aioa-hikari
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:192.168.31.129}
      port: ${SPRING_REDIS_PORT:6379}
      # password: ${SPRING_REDIS_PASSWORD:}
      # database: ${SPRING_REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 知识库上传上限 50MB（FR-F1）
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      # SSE 长连接，超时由心跳保活（SseEmitter(0) 不超时）
      request-timeout: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: 'null'

aioa:
  jwt:
    secret: ${AIOA_JWT_SECRET:aioa-dev-jwt-secret-please-change-in-production}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  service-jwt:
    secret: ${AIOA_SERVICE_JWT_SECRET:aioa-dev-service-jwt-secret-please-change}
  agent:
    base-url: ${AIOA_AGENT_BASE_URL:http://localhost:8000}
  kb:
    # 知识库存储实现：mysql（默认，LIKE 检索）/ vector（预留，切换向量数据库时启用）
    store: ${AIOA_KB_STORE:mysql}
  repo:
    # 代码托管方选择：gitee（默认）/ gitea。
    # 两个实现互斥装配，容器里恰好一个 RepoProviderClient —— 上层按接口注入，切换无需改业务代码。
    # 注意：切换后 Gitee 那套配置整体不生效，需另配 aioa.gitea.*（两家的 OAuth 端点、
    # scope 词表、Webhook 校验算法、分页参数名全都不同，不是「改个地址」就能换）。
    provider: ${AIOA_REPO_PROVIDER:gitee}
  gitee:
    # 总开关：关闭时所有 Gitee 任务不入队、Webhook 不处理（用于无外网的部署环境）
    enabled: ${AIOA_GITEE_ENABLED:true}
    # V5 OpenAPI 与网页域：base-url 可指向本地桩服务以做端到端回归（无需真实 Gitee）
    base-url: ${AIOA_GITEE_BASE_URL:https://gitee.com/api/v5}
    web-base-url: ${AIOA_GITEE_WEB_URL:https://gitee.com}
    # 用户浏览器「授权页」基址（授权跳转 = {此值}/oauth/authorize）。
    # 默认真实 Gitee，故生产无需配置。只有做端到端回归、且已把上面两项指向本地桩时，
    # 才需要把它一并指向桩；否则用户的浏览器会被送进桩，看到假授权页与假账号。
    oauth-authorize-base-url: ${AIOA_GITEE_OAUTH_AUTHORIZE_URL:https://gitee.com}
    # OAuth2 应用（在 Gitee「设置 → 第三方应用」创建；回调地址须与本处 redirect-uri 完全一致）
    client-id: ${AIOA_GITEE_CLIENT_ID:}
    client-secret: ${AIOA_GITEE_CLIENT_SECRET:}
    redirect-uri: ${AIOA_GITEE_REDIRECT_URI:http://localhost:8080/api/v1/gitee/bind/callback}
    # 授权 scope（空格分隔）。必须同时含 projects（仓库读写）与 hook（Webhook 读写）——
    # 二者在 Gitee 是两个独立 scope，没有 GitHub 式聚合的 repo。
    # 改这里须同步 Gitee「第三方应用」登记页勾选的权限，否则授权可能失败。
    scope: ${AIOA_GITEE_SCOPE:user_info projects hook pull_requests issues notes}
    # Gitee 组织 login：部门项目仓库都建在它下面；留空则建在绑定用户自己的命名空间下
    org: ${AIOA_GITEE_ORG:}
    # Webhook 回调基址：必须是 Gitee 能访问到的公网地址（127.0.0.1 无效）
    webhook-base-url: ${AIOA_GITEE_WEBHOOK_BASE_URL:}
    # 留空 = 每个仓库随机生成密钥（推荐）；填了则所有仓库共用同一密钥
    webhook-secret: ${AIOA_GITEE_WEBHOOK_SECRET:}
    # 令牌加密密钥（AES-256）：生产必须通过环境变量覆盖，否则授权令牌可被离线解密
    token-enc-key: ${AIOA_GITEE_TOKEN_ENC_KEY:aioa-dev-gitee-token-key-please-change}
    # 授权完成后的前端回跳地址
    bind-return-url: ${AIOA_GITEE_BIND_RETURN_URL:http://localhost:5173/}
    # 速率控制：全局限流 + 队列批量 + 退避重试（Gitee 高频请求会返回 403 Rate Limit Exceeded）
    min-request-interval-ms: 120
    task-batch-size: 5
    max-attempts: 5
    http-timeout-seconds: 30
    # 周期性轻量校准：默认每小时 17 分（避开整点高峰）
    sync-enabled: ${AIOA_GITEE_SYNC_ENABLED:true}
    sync-cron: ${AIOA_GITEE_SYNC_CRON:0 17 * * * *}
    # 删除项目时是否连带删除 Gitee 仓库：默认 false（误删代码不可恢复）
    purge-repo-on-delete: false

  gitea:
    # 仅当 aioa.repo.provider=gitea 时生效（默认 false，不影响现有 Gitee 部署）
    enabled: ${AIOA_GITEA_ENABLED:false}
    # REST 基址：**必须带 /api/v1**（Gitea 的 REST 全在 /api/v1 下；漏了会打到网页路径拿回 HTML）
    base-url: ${AIOA_GITEA_BASE_URL:}
    # 网页域：OAuth 端点与「跳转原仓库」链接用它（OAuth 不在 /api/v1 下）
    web-base-url: ${AIOA_GITEA_WEB_URL:}
    # 用户浏览器授权页基址（授权跳转 = {此值}/login/oauth/authorize）。
    # 与 web-base-url 分开维护：服务端可被指向桩做回归，但用户的浏览器必须到达真实例。
    oauth-authorize-base-url: ${AIOA_GITEA_OAUTH_AUTHORIZE_URL:}
    # OAuth2 应用（Gitea「设置 → 应用」创建；回调地址须与本处 redirect-uri 完全一致）
    client-id: ${AIOA_GITEA_CLIENT_ID:}
    client-secret: ${AIOA_GITEA_CLIENT_SECRET:}
    redirect-uri: ${AIOA_GITEA_REDIRECT_URI:http://localhost:8080/api/v1/gitea/bind/callback}
    # 授权 scope（空格分隔）。词表与 Gitee **完全不同**（Gitee 是 projects/hook）。
    # 另：Gitea 返回的是应用登记时勾选的全部权限，不严格按 URL 上的 scope 收窄
    # ⇒ 应用登记页的勾选同样是有效范围，两处都要对。
    scope: ${AIOA_GITEA_SCOPE:repo read:organization notification issue}
    # 组织名：仓库都建在它下面；留空则建在绑定用户名下
    org: ${AIOA_GITEA_ORG:}
    # Webhook 回调基址：必须是 **Gitea 能访问到** 的地址（本机/内网地址从 Gitea 视角不可达）
    webhook-base-url: ${AIOA_GITEA_WEBHOOK_BASE_URL:}
    # HMAC-SHA256 签名密钥（回调头 X-Gitea-Signature）；留空 = 每仓库随机生成
    webhook-secret: ${AIOA_GITEA_WEBHOOK_SECRET:}
    # 令牌加密密钥（AES-256）：生产必须通过环境变量覆盖
    token-enc-key: ${AIOA_GITEA_TOKEN_ENC_KEY:aioa-dev-gitea-token-key-please-change}
    # 仓库标识来源（Gitea 只有一个 name 兼作 URL 片段，而 Gitee 的 name/path 是两个字段）：
    # AUTO=优先 path、为空回落 name（默认）；NAME=总是用 name（中文会进 URL）；PATH=总是用 path，为空则报错
    repo-name-source: ${AIOA_GITEA_REPO_NAME_SOURCE:AUTO}
    min-request-interval-ms: 120
    http-timeout-seconds: 30
    # 分页：Gitea 服务端硬上限 max_response_items 默认 50，请求更大也只回 50 ⇒ 必须翻页
    list-page-size: 100
    list-max-pages: 20
    # TLS：私有化 Gitea 常用自签证书。优先用 trust-store 导入自签 CA；
    # insecure-skip-verify 是最后手段（会关闭服务端身份校验，启动时打 WARN，便于审计）
    insecure-skip-verify: ${AIOA_GITEA_INSECURE_SKIP_VERIFY:false}
    trust-store: ${AIOA_GITEA_TRUST_STORE:}
    trust-store-password: ${AIOA_GITEA_TRUST_STORE_PASSWORD:}
    trust-store-type: ${AIOA_GITEA_TRUST_STORE_TYPE:PKCS12}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    cn.aioa: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
