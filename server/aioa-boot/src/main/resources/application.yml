server:
  port: 8080

spring:
  application:
    name: aioa-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aioa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: aioa-hikari
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:192.168.31.129}
      port: ${SPRING_REDIS_PORT:6379}
      # password: ${SPRING_REDIS_PASSWORD:}
      # database: ${SPRING_REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 知识库上传上限 50MB（FR-F1）
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      # SSE 长连接，超时由心跳保活（SseEmitter(0) 不超时）
      request-timeout: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: 'null'

aioa:
  jwt:
    secret: ${AIOA_JWT_SECRET:aioa-dev-jwt-secret-please-change-in-production}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  service-jwt:
    secret: ${AIOA_SERVICE_JWT_SECRET:aioa-dev-service-jwt-secret-please-change}
  agent:
    base-url: ${AIOA_AGENT_BASE_URL:http://localhost:8000}
  kb:
    # 知识库存储实现：mysql（默认，LIKE 检索）/ vector（预留，切换向量数据库时启用）
    store: ${AIOA_KB_STORE:mysql}
  gitee:
    # 总开关：关闭时所有 Gitee 任务不入队、Webhook 不处理（用于无外网的部署环境）
    enabled: ${AIOA_GITEE_ENABLED:true}
    # V5 OpenAPI 与网页域：base-url 可指向本地桩服务以做端到端回归（无需真实 Gitee）
    base-url: ${AIOA_GITEE_BASE_URL:https://gitee.com/api/v5}
    web-base-url: ${AIOA_GITEE_WEB_URL:https://gitee.com}
    # 用户浏览器「授权页」基址（授权跳转 = {此值}/oauth/authorize）。
    # 默认真实 Gitee，故生产无需配置。只有做端到端回归、且已把上面两项指向本地桩时，
    # 才需要把它一并指向桩；否则用户的浏览器会被送进桩，看到假授权页与假账号。
    oauth-authorize-base-url: ${AIOA_GITEE_OAUTH_AUTHORIZE_URL:https://gitee.com}
    # OAuth2 应用（在 Gitee「设置 → 第三方应用」创建；回调地址须与本处 redirect-uri 完全一致）
    client-id: ${AIOA_GITEE_CLIENT_ID:}
    client-secret: ${AIOA_GITEE_CLIENT_SECRET:}
    redirect-uri: ${AIOA_GITEE_REDIRECT_URI:http://localhost:8080/api/v1/gitee/bind/callback}
    scope: ${AIOA_GITEE_SCOPE:user_info projects pull_requests issues notes}
    # Gitee 组织 login：部门项目仓库都建在它下面；留空则建在绑定用户自己的命名空间下
    org: ${AIOA_GITEE_ORG:}
    # Webhook 回调基址：必须是 Gitee 能访问到的公网地址（127.0.0.1 无效）
    webhook-base-url: ${AIOA_GITEE_WEBHOOK_BASE_URL:}
    # 留空 = 每个仓库随机生成密钥（推荐）；填了则所有仓库共用同一密钥
    webhook-secret: ${AIOA_GITEE_WEBHOOK_SECRET:}
    # 令牌加密密钥（AES-256）：生产必须通过环境变量覆盖，否则授权令牌可被离线解密
    token-enc-key: ${AIOA_GITEE_TOKEN_ENC_KEY:aioa-dev-gitee-token-key-please-change}
    # 授权完成后的前端回跳地址
    bind-return-url: ${AIOA_GITEE_BIND_RETURN_URL:http://localhost:5173/}
    # 速率控制：全局限流 + 队列批量 + 退避重试（Gitee 高频请求会返回 403 Rate Limit Exceeded）
    min-request-interval-ms: 120
    task-batch-size: 5
    max-attempts: 5
    http-timeout-seconds: 30
    # 周期性轻量校准：默认每小时 17 分（避开整点高峰）
    sync-enabled: ${AIOA_GITEE_SYNC_ENABLED:true}
    sync-cron: ${AIOA_GITEE_SYNC_CRON:0 17 * * * *}
    # 删除项目时是否连带删除 Gitee 仓库：默认 false（误删代码不可恢复）
    purge-repo-on-delete: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    cn.aioa: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
