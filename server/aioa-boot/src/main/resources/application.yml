server:
  port: 8080

spring:
  application:
    name: aioa-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aioa}
    username: ${SPRING_DATASOURCE_USERNAME:aioa}
    password: ${SPRING_DATASOURCE_PASSWORD:aioa_dev_pwd}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: aioa-hikari
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      # password: ${SPRING_REDIS_PASSWORD:}
      # database: ${SPRING_REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    async:
      # SSE 长连接，超时由心跳保活（SseEmitter(0) 不超时）
      request-timeout: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: 'null'

aioa:
  jwt:
    secret: ${AIOA_JWT_SECRET:aioa-dev-jwt-secret-please-change-in-production}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  service-jwt:
    secret: ${AIOA_SERVICE_JWT_SECRET:aioa-dev-service-jwt-secret-please-change}
  agent:
    base-url: ${AIOA_AGENT_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    cn.aioa: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
