server:
  port: 8080

spring:
  application:
    name: aios-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aios?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: aios-hikari
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${SPRING_REDIS_HOST:192.168.31.129}
      port: ${SPRING_REDIS_PORT:6379}
      # password: ${SPRING_REDIS_PASSWORD:}
      # database: ${SPRING_REDIS_DATABASE:0}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 上传体积上限的**引用**，不写数字：唯一数字在 aios.file.max-size-mb。
      # 历史缺陷（docs/44 §3.3-5）：这里写 50MB、FileController 里又硬编码 50MB，
      # 两处各一份 ⇒ 将来只改一处就会出现「容器放行、应用层仍按旧值 400」的口径漂移。
      max-file-size: ${aios.file.max-size-mb:50}MB
      max-request-size: ${aios.file.max-size-mb:50}MB
  mvc:
    async:
      # SSE 长连接，超时由心跳保活（SseEmitter(0) 不超时）
      request-timeout: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_at
      logic-delete-value: now()
      logic-not-delete-value: 'null'

aios:
  # ─── 单端口入口（docs/33）──────────────────────────────────────────────────
  # 去掉对外部 nginx 的依赖：由本进程一个端口同时提供三块内容
  #   {prefix}/h5/   用户端（H5 单文件所在目录）
  #   {prefix}/web/  管理端（dist 产物，其下可有 subapps/<name>/ 各自回退首页）
  #   {prefix}/api/  业务接口 —— 进入安全链之前剥成 /api/** 以复用既有控制器；
  #                  同时 /api/** 原样保留（44 个既有套件与现场脚本均按此形态直连，
  #                  改用 server.servlet.context-path 会让它们同时失效，故取「双前缀并存」）。
  # 目录不可用时该入口整体 404（启动日志给 WARN 指明是哪个键），不会 500。
  web:
    enabled: ${AIOS_WEB_ENABLED:true}
    prefix: ${AIOS_WEB_PREFIX:/aios}
    # 容器内挂载点：H5 单文件与 aios-web 产物（见 deploy/docker-compose.yml）
    h5-dir: ${AIOS_WEB_H5_DIR:/app/h5}
    web-dir: ${AIOS_WEB_WEB_DIR:/app/web}
    h5-index: index.html
    web-index: index.html
  jwt:
    secret: ${AIOS_JWT_SECRET:aios-dev-jwt-secret-please-change-in-production}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 604800
  service-jwt:
    secret: ${AIOS_SERVICE_JWT_SECRET:aios-dev-service-jwt-secret-please-change}
  agent:
    base-url: ${AIOS_AGENT_BASE_URL:http://localhost:8000}
  # 语音输入（ASR）：H5 录好音频 → 本服务转发 → agent 离线识别成文字。
  # 录音必须在浏览器做（getUserMedia），服务端只收音频字节，不碰麦克风。
  asr:
    enabled: ${AIOS_ASR_ENABLED:true}
    # 单次音频上限（字节）。与 agent 侧 AIOS_ASR_MAX_BYTES 同义，改一处要同时改，
    # 否则会出现「Java 放行、agent 拒绝」的两套阈值（且文案与实际拒绝值不一致）。
    max-bytes: ${AIOS_ASR_MAX_BYTES:10485760}
    agent-path: /internal/v1/asr/transcribe
    status-path: /internal/v1/asr/status
  # 上传体积上限的**唯一定义处**（单位 MB）。两类消费者都取它，不各写一份数字：
  #   ① spring.servlet.multipart.max-file-size / max-request-size（容器级硬闸，占位符引用）；
  #   ② FileController 的友好 400「文件超过 N MB 上限」（应用级校验）。
  # 起因是 docs/44 §3.3-5：同一上限曾同时硬编码在 yml 与 FileController，
  # 只改一处就会漂移（表现为容器放行、应用层仍按旧值拒绝）。
  file:
    max-size-mb: ${AIOS_FILE_MAX_SIZE_MB:50}
  # ─── 非遗四川 2023（scfy）只读接入 ──────────────────────────────────────────
  # 默认关闭：这段配置不开 = 不注册任何工具、不出现在模型能力清单里（可插拔）。
  # 开启后提供 55 个只读查询工具（传承人 9 / 项目 8 / 工坊 13 / 保护区 11 / 旅游 14），
  # 全部走免登录的 /show/* 接口，不提供任何增删改能力。
  #
  # 环境（两处实测，2026-09-23）：
  #   生产  https://szbhpt.tsichuan.com/scfy —— 55 个查询工具全量实测通过（矩阵报告可复跑）
  #   本机后台测试服务  http://127.0.0.1:16060/scfy
  #       服务已起（PID 见 16060），/show/* 与生产一样免登录；
  #       但其数据源当前取不到连接：任何 /show/* 都会在 20s 后返回
  #       code=500 GetConnectionTimeoutException(wait millis 10000, active 0, creating 0)，
  #       即「连不上库」。库修好前切换 base-url 没有意义，故默认仍指生产。
  # 要切测试服务只需改这里（或设 AIOS_SCFY_BASE_URL），无需改代码。
  integration:
    scfy:
      enabled: ${AIOS_SCFY_ENABLED:false}
      base-url: ${AIOS_SCFY_BASE_URL:https://szbhpt.tsichuan.com/scfy}
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
      max-bytes: 524288          # 单次响应字节上限，超出即截断并置 responseTruncated
      max-attempts: 2            # 幂等 GET 的重试次数（仅网络异常/5xx）
      retry-backoff-ms: 300
      verify-ssl: true
      # 需登录接口（后台 CRUD / 小程序）暂不接入：当前阶段业务约束是只读，
      # 且 /show/* 全部免登录。待后台测试服务提供账号后再开。
      # login-enabled: true 时必须同时给 username/password，
      # 否则启动即失败 —— 不允许静默降级成匿名，那会让需登录接口以 401 伪装成「无数据」。
      login-enabled: false
      # username: ${AIOS_SCFY_USERNAME:}
      # password: ${AIOS_SCFY_PASSWORD:}
  kb:
    # ─── 知识库存储与嵌入（docs/32「向量库重建为 Milvus」）───────────────────────
    # 存储实现：mysql（默认，切片 + 向量 BLOB + 应用层余弦）/ milvus（向量库 + 原生混合检索）。
    # 两者互斥装配（@ConditionalOnProperty），业务层（管理端 / 用户端 / agent / 工具网关）零改动。
    # 注意：store=milvus 时 Milvus 必须在线——连不上则**应用直接启动失败**，不静默降级为空结果。
    store: ${AIOS_KB_STORE:mysql}
    # 嵌入实现：local（默认，256 维 char n-gram 哈希；零依赖可复现但**无语义**）
    #           http（复用已有 ollama / vllm 暴露语义向量，需配下面 embedding.* 与 milvus.dims）
    embedding-provider: ${AIOS_KB_EMBEDDING_PROVIDER:local}
    # 换 provider / 换模型后置 true 跑一次全量重算（幂等：只处理 provider 或维度不符的切片）。
    # 不重算的后果是静默的——旧维度向量与新 query 向量余弦恒为 0，检索「不出错但永不命中」。
    reembed-on-start: ${AIOS_KB_REEMBED_ON_START:false}
    embedding:
      # 协议形态：ollama（/api/embeddings 或 /api/embed）/ openai（/v1/embeddings）
      format: ${AIOS_KB_EMBEDDING_FORMAT:ollama}
      # 例：Ollama http://localhost:11434/api/embeddings ；vLLM http://localhost:8001/v1/embeddings
      url: ${AIOS_KB_EMBEDDING_URL:}
      model: ${AIOS_KB_EMBEDDING_MODEL:bge-small-zh-v1.5}
      # 必须与 Milvus 集合维度一致（Milvus 集合维度创建后不可改）
      dims: ${AIOS_KB_EMBEDDING_DIMS:512}
      timeout-ms: ${AIOS_KB_EMBEDDING_TIMEOUT_MS:15000}
      # 可选 Bearer 令牌（vLLM 网关常需）
      api-key: ${AIOS_KB_EMBEDDING_API_KEY:}
    milvus:
      # Milvus 单机（compose 里 milvus-standalone 暴露 19530）
      uri: ${AIOS_MILVUS_URI:http://localhost:19530}
      token: ${AIOS_MILVUS_TOKEN:}
      database: ${AIOS_MILVUS_DATABASE:default}
      # 集合名**带版本后缀**：维度创建后不可改，换嵌入模型必须新建集合（如 kb_chunk_v2）再回填
      collection: ${AIOS_MILVUS_COLLECTION:kb_chunk_v1}
      dims: ${AIOS_MILVUS_DIMS:512}
      metric-type: ${AIOS_MILVUS_METRIC:COSINE}
      index-type: ${AIOS_MILVUS_INDEX:HNSW}
      hnsw-m: ${AIOS_MILVUS_HNSW_M:16}
      hnsw-ef-construction: ${AIOS_MILVUS_HNSW_EF:200}
      # 原生 BM25（需 Milvus >= 2.5）。建集合失败会自动退回「纯稠密」并在日志告警，
      # 此时 bm25 / hybrid 的关键词腿改由 MySQL 切片打分兜底（口径与 mysql 档位一致）。
      enable-bm25: ${AIOS_MILVUS_ENABLE_BM25:true}
      # 启动时从 kb_chunk 全量回填 Milvus（首次接入 / 索引损坏后重建）
      backfill-on-start: ${AIOS_MILVUS_BACKFILL:false}
      timeout-ms: ${AIOS_MILVUS_TIMEOUT_MS:10000}
      backfill-batch-size: ${AIOS_MILVUS_BATCH:200}
  repo:
    # 代码托管方选择：gitee（默认）/ gitea。
    # 两个实现互斥装配，容器里恰好一个 RepoProviderClient —— 上层按接口注入，切换无需改业务代码。
    # 注意：切换后 Gitee 那套配置整体不生效，需另配 aios.gitea.*（两家的 OAuth 端点、
    # scope 词表、Webhook 校验算法、分页参数名全都不同，不是「改个地址」就能换）。
    provider: ${AIOS_REPO_PROVIDER:gitee}
  gitee:
    # 总开关：关闭时所有 Gitee 任务不入队、Webhook 不处理（用于无外网的部署环境）
    enabled: ${AIOS_GITEE_ENABLED:true}
    # V5 OpenAPI 与网页域：base-url 可指向本地桩服务以做端到端回归（无需真实 Gitee）
    base-url: ${AIOS_GITEE_BASE_URL:https://gitee.com/api/v5}
    web-base-url: ${AIOS_GITEE_WEB_URL:https://gitee.com}
    # 用户浏览器「授权页」基址（授权跳转 = {此值}/oauth/authorize）。
    # 默认真实 Gitee，故生产无需配置。只有做端到端回归、且已把上面两项指向本地桩时，
    # 才需要把它一并指向桩；否则用户的浏览器会被送进桩，看到假授权页与假账号。
    oauth-authorize-base-url: ${AIOS_GITEE_OAUTH_AUTHORIZE_URL:https://gitee.com}
    # OAuth2 应用（在 Gitee「设置 → 第三方应用」创建；回调地址须与本处 redirect-uri 完全一致）
    client-id: ${AIOS_GITEE_CLIENT_ID:}
    client-secret: ${AIOS_GITEE_CLIENT_SECRET:}
    redirect-uri: ${AIOS_GITEE_REDIRECT_URI:http://localhost:8080/api/v1/gitee/bind/callback}
    # 授权 scope（空格分隔）。必须同时含 projects（仓库读写）与 hook（Webhook 读写）——
    # 二者在 Gitee 是两个独立 scope，没有 GitHub 式聚合的 repo。
    # 改这里须同步 Gitee「第三方应用」登记页勾选的权限，否则授权可能失败。
    scope: ${AIOS_GITEE_SCOPE:user_info projects hook pull_requests issues notes}
    # Gitee 组织 login：部门项目仓库都建在它下面；留空则建在绑定用户自己的命名空间下
    org: ${AIOS_GITEE_ORG:}
    # Webhook 回调基址：必须是 Gitee 能访问到的公网地址（127.0.0.1 无效）
    webhook-base-url: ${AIOS_GITEE_WEBHOOK_BASE_URL:}
    # 留空 = 每个仓库随机生成密钥（推荐）；填了则所有仓库共用同一密钥
    webhook-secret: ${AIOS_GITEE_WEBHOOK_SECRET:}
    # 令牌加密密钥（AES-256）：生产必须通过环境变量覆盖，否则授权令牌可被离线解密
    token-enc-key: ${AIOS_GITEE_TOKEN_ENC_KEY:aios-dev-gitee-token-key-please-change}
    # 授权完成后的前端回跳地址
    bind-return-url: ${AIOS_GITEE_BIND_RETURN_URL:http://localhost:5173/}
    # 速率控制：全局限流 + 队列批量 + 退避重试（Gitee 高频请求会返回 403 Rate Limit Exceeded）
    min-request-interval-ms: 120
    task-batch-size: 5
    max-attempts: 5
    http-timeout-seconds: 30
    # 周期性轻量校准：默认每小时 17 分（避开整点高峰）
    sync-enabled: ${AIOS_GITEE_SYNC_ENABLED:true}
    sync-cron: ${AIOS_GITEE_SYNC_CRON:0 17 * * * *}
    # 删除项目时是否连带删除 Gitee 仓库：默认 false（误删代码不可恢复）
    purge-repo-on-delete: false

  gitea:
    # 仅当 aios.repo.provider=gitea 时生效（默认 false，不影响现有 Gitee 部署）
    enabled: ${AIOS_GITEA_ENABLED:false}
    # REST 基址：**必须带 /api/v1**（Gitea 的 REST 全在 /api/v1 下；漏了会打到网页路径拿回 HTML）
    base-url: ${AIOS_GITEA_BASE_URL:}
    # 网页域：OAuth 端点与「跳转原仓库」链接用它（OAuth 不在 /api/v1 下）
    web-base-url: ${AIOS_GITEA_WEB_URL:}
    # 用户浏览器授权页基址（授权跳转 = {此值}/login/oauth/authorize）。
    # 与 web-base-url 分开维护：服务端可被指向桩做回归，但用户的浏览器必须到达真实例。
    oauth-authorize-base-url: ${AIOS_GITEA_OAUTH_AUTHORIZE_URL:}
    # OAuth2 应用（Gitea「设置 → 应用」创建；回调地址须与本处 redirect-uri 完全一致）
    client-id: ${AIOS_GITEA_CLIENT_ID:}
    client-secret: ${AIOS_GITEA_CLIENT_SECRET:}
    redirect-uri: ${AIOS_GITEA_REDIRECT_URI:http://localhost:8080/api/v1/gitea/bind/callback}
    # 授权 scope（空格分隔）。词表与 Gitee **完全不同**（Gitee 是 projects/hook）。
    # 另：Gitea 返回的是应用登记时勾选的全部权限，不严格按 URL 上的 scope 收窄
    # ⇒ 应用登记页的勾选同样是有效范围，两处都要对。
    scope: ${AIOS_GITEA_SCOPE:repo read:organization notification issue}
    # 组织名：仓库都建在它下面；留空则建在绑定用户名下
    org: ${AIOS_GITEA_ORG:}
    # Webhook 回调基址：必须是 **Gitea 能访问到** 的地址（本机/内网地址从 Gitea 视角不可达）
    webhook-base-url: ${AIOS_GITEA_WEBHOOK_BASE_URL:}
    # HMAC-SHA256 签名密钥（回调头 X-Gitea-Signature）；留空 = 每仓库随机生成
    webhook-secret: ${AIOS_GITEA_WEBHOOK_SECRET:}
    # 令牌加密密钥（AES-256）：生产必须通过环境变量覆盖
    token-enc-key: ${AIOS_GITEA_TOKEN_ENC_KEY:aios-dev-gitea-token-key-please-change}
    # 仓库标识来源（Gitea 只有一个 name 兼作 URL 片段，而 Gitee 的 name/path 是两个字段）：
    # AUTO=优先 path、为空回落 name（默认）；NAME=总是用 name（中文会进 URL）；PATH=总是用 path，为空则报错
    repo-name-source: ${AIOS_GITEA_REPO_NAME_SOURCE:AUTO}
    min-request-interval-ms: 120
    http-timeout-seconds: 30
    # 分页：Gitea 服务端硬上限 max_response_items 默认 50，请求更大也只回 50 ⇒ 必须翻页
    list-page-size: 100
    list-max-pages: 20
    # TLS：私有化 Gitea 常用自签证书。优先用 trust-store 导入自签 CA；
    # insecure-skip-verify 是最后手段（会关闭服务端身份校验，启动时打 WARN，便于审计）
    insecure-skip-verify: ${AIOS_GITEA_INSECURE_SKIP_VERIFY:false}
    trust-store: ${AIOS_GITEA_TRUST_STORE:}
    trust-store-password: ${AIOS_GITEA_TRUST_STORE_PASSWORD:}
    trust-store-type: ${AIOS_GITEA_TRUST_STORE_TYPE:PKCS12}

  connector:
    # 连接器用户凭据加密密钥（AES-256-GCM，与 GiteeCrypto 同口径）。生产必须通过环境变量覆盖
    secret-key: ${AIOS_CONNECTOR_SECRET_KEY:aios-dev-connector-secret-key-please-change}
    # OAuth2 回调公网基址：拼接企业微信回调地址用；为空则回退到发起授权请求的 Origin
    public-base: ${AIOS_CONNECTOR_PUBLIC_BASE:}
    wechat-work:
      # 企业微信自建应用配置（平台级）；租户级优先于它，见 connector_tenant_config 表
      corp-id: ${AIOS_CONNECTOR_WECOM_CORP_ID:}
      agent-id: ${AIOS_CONNECTOR_WECOM_AGENT_ID:}
      corp-secret: ${AIOS_CONNECTOR_WECOM_CORP_SECRET:}

  mcp:
    # 内置连接器的 MCP 服务（mcp-hub）基址；信任探活与运行期都由它代理
    hub-url: ${AIOS_MCP_HUB_URL:http://127.0.0.1:8099}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    cn.aios: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
