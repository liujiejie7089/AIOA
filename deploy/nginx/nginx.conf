# ============================================================================
# ⚠️ 历史档（HISTORICAL）—— 自 docs/33「单端口部署改造」起，本文件**不再参与部署**。
#    compose 已删除 `nginx` 服务；H5 / 管理端 / 接口三者现由 aioa-server :8080 单端口
#    经 /aioa/h5、/aioa/web、/aioa/api 统一前缀提供（详见 deploy/生产部署手册.md §0）。
#    保留本文件的唯一用途：给「用自己前置 nginx 反代 :8080」的现场当**参考样例**，
#    以及保留 SSE（`proxy_buffering off`）这段容易写错的配置。**照抄前请先读 docs/33。**
# ----------------------------------------------------------------------------
# AIOA 边缘 Nginx（历史）—— 对外两个端口
#   80 = 用户端 H5（对外主入口）
#   81 = 管理端 shell
#
# 两者共用 /etc/nginx/api-proxy.conf 里的 API 反代 location，避免两端行为漂移。
# HTTPS 建议由前置 Nginx / 宝塔 / Cloudflare 终止（本容器只监听明文端口）。
# ============================================================================
user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  75s;
    client_max_body_size 60m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream aioa_web    { server web:80; }
    upstream aioa_server { server server:8080; }
    upstream aioa_agent  { server agent:8000; }

    # ========================================================================
    # 80 —— 用户端 H5
    #   H5 是**单文件应用**（user-client/index.html，由 compose 卷挂载到
    #   /usr/share/nginx/html/h5/index.html）：不是独立容器、也没有独立端口，
    #   所以这里用 root 直接静态托管，不存在「反代到 5181 / serve.py」这一步。
    # ========================================================================
    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html/h5;
        index index.html;

        location / {
            try_files $uri /index.html;
        }

        # 兼容旧链接与手册里的 /h5/ 写法（与 80 的根路径等价）
        location /h5/ {
            alias /usr/share/nginx/html/h5/;
            try_files $uri /h5/index.html;
        }

        include /etc/nginx/api-proxy.conf;
    }

    # ========================================================================
    # 81 —— 管理端（Vue3 shell；静态资源由 web 容器内的 nginx 托管）
    # ========================================================================
    server {
        listen 81;
        server_name _;

        # 前端静态资源（shell + 子应用）
        location / {
            proxy_pass http://aioa_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        include /etc/nginx/api-proxy.conf;
    }

    # ---- agent 直连调试路径已禁用 ----
    # 如需排查 agent 内部端点，用 `docker exec -it aioa-agent sh` 进入容器调试；
    # 或临时在对应 server 块内打开下方 location（用完立即注释回）。生产环境严禁开启。
    # location /agent-debug/ {
    #     proxy_pass http://aioa_agent/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    # }
}
