user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  75s;
    client_max_body_size 60m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream aioa_web    { server web:80; }
    upstream aioa_server { server server:8080; }
    upstream aioa_agent  { server agent:8000; }

    server {
        listen 80;
        server_name _;

        # 前端静态资源（shell + 子应用）
        location / {
            proxy_pass http://aioa_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 用户端 H5（单文件应用，卷挂载 /usr/share/nginx/html/h5/index.html）
        # 内部只用相对路径调 /api，所以同源即可用，无需任何前端环境变量
        location /h5/ {
            alias /usr/share/nginx/html/h5/;
            try_files $uri /h5/index.html;
        }

        # 业务 API（前端 ⇄ Java）
        location /api/ {
            proxy_pass http://aioa_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSE 专用：必须关闭缓冲，否则流式变一次性返回
        location ~ ^/api/v1/runs/[^/]+/events$ {
            proxy_pass http://aioa_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 开放 API（M4，对外）
        location /openapi/ {
            proxy_pass http://aioa_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 注意：/internal/** 故意不暴露，仅容器内网可达

        # ---- agent 直连调试路径已禁用 ----
        # 如需排查 agent 内部端点，用 `docker exec -it aioa-agent sh` 进入容器调试；
        # 或临时打开下方 location（用完立即注释回）。生产环境严禁开启。
        # location /agent-debug/ {
        #     proxy_pass http://aioa_agent/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Connection "";
        #     proxy_buffering off;
        #     proxy_read_timeout 3600s;
        # }
    }
}