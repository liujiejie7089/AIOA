user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  75s;
    client_max_body_size 60m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream aioa_web    { server web:80; }
    upstream aioa_server { server server:8080; }
    upstream aioa_agent  { server agent:8000; }

    server {
        listen 80;
        server_name _;

        # 前端静态资源（shell + 子应用）
        location / {
            proxy_pass http://aioa_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 业务 API（前端 ⇄ Java）
        location /api/ {
            proxy_pass http://aioa_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSE 专用：必须关闭缓冲，否则流式变一次性返回
        location ~ ^/api/v1/runs/[^/]+/events$ {
            proxy_pass http://aioa_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 开放 API（M4，对外）
        location /openapi/ {
            proxy_pass http://aioa_server;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 注意：/internal/** 故意不暴露，仅容器内网可达

        # agent 直连仅用于调试（生产可注释掉）
        location /agent-debug/ {
            proxy_pass http://aioa_agent/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
