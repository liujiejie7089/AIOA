# ============================================================================
# AIOA 入口 Nginx（:80）—— 用更短的路径进两个前端
#
#   http://<主机>/web    → 管理端（Vue3 shell，生产入口 http://<主机>/aioa/web/）
#   http://<主机>/user   → 用户端（H5 单文件，生产入口 http://<主机>/aioa/h5/）
#   http://<主机>/aioa/  → 单端口后端（/aioa/h5、/aioa/web、/aioa/api 三者同源）
#   http://<主机>/api/   → 后端接口（**旧口径根前缀**，保留；既有脚本零改动）
#
# 由 deploy/docker-compose.yml 的 `nginx` 服务加载为
# /etc/nginx/conf.d/default.conf（本文件自带 server{} 块，放在 conf.d 下即可）。
# ----------------------------------------------------------------------------
# ★ 为什么 /web 是「302 跳转」而 /user 是「内部改写」——两者不可互换
#
#   ① 管理端：产物按 `base=/aioa/web/` 构建（web/apps/shell/vite.config.ts），
#      路由是 createWebHistory(BASE_URL) ⇒ 它引用的静态资源与**站内路由前缀**
#      永远是 /aioa/web/。若把 /web/ 内部改写成 /aioa/web/ 直接回内容，
#      浏览器地址栏停在 /web/，而 vue-router 的 base 是 /aioa/web/
#      ⇒ 当前路径不在 base 之下，首个路由匹配就可能 404 / 白屏。
#      所以 /web **必须**跳到 /aioa/web/，让地址栏回到 SPA 的 base 之下。
#      （要让地址栏始终显示 /web，需用 base=/web/ **重新构建**管理端，属另一件事。）
#
#   ② 用户端 H5：接口基址由**浏览器地址栏的 pathname** 推导
#      （user-client/index.html 的 apiBaseFromPath）：
#          末段 = h5 ⇒ 前缀换成 api（/aioa/h5/ ⇒ /aioa/api）
#          其它路径   ⇒ 直接落在根 /api
#      它是**自包含单文件**（除了 Google Fonts 绝对地址，无任何相对资源引用），
#      且站内导航用查询参数（?expert= / ?page=）而不是路径。
#      ⇒ 把 /user/ 内部改写成 /aioa/h5/ 是安全的：地址栏稳定停在 /user/，
#        页面推导出的接口基址是 /api，正好由下面的 `location /api/` 接住。
#      ⇒ **无需重新构建 H5**，/user 就是一个真正的干净入口。
# ----------------------------------------------------------------------------
# ★ 部署形态
#   本文件按 **compose 里的 nginx 容器**写（后端用服务名 `server:8080`）。
#   若改用宿主自装 nginx：把下面 upstream 里的 `server server:8080;`
#   改成 `server 127.0.0.1:8080;`，其余（含 SSE 那段）原样可用。
# ============================================================================

upstream aioa_server {
    server server:8080;      # ← 宿主自装 nginx 请改为 127.0.0.1:8080
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 附件 / 知识库文档上传（与后端 spring.servlet.multipart 上限对齐）
    client_max_body_size 60m;

    # 反代公共头。集中在这里的每处 location 手动重复，是为了避免
    # 「某个 location 忘了写 Connection "" 导致 SSE 变成攒包返回」这类静默漂移。
    # （nginx 的 add_header/proxy_set_header 不跨 location 继承到 include 的写法，
    #   故此处用复制而非抽象；改动时请一并改 SSE 段。）

    # ------------------------------------------------------------------ 入口
    # 根路径 → 用户端（对外主入口）
    location = / {
        return 302 /user/;
    }

    # 管理端：带上斜杠规范 + 跳到 SPA 自己的 base（原因见文件头 ①）
    location = /web {
        return 302 /aioa/web/;
    }
    location = /web/ {
        return 302 /aioa/web/;
    }

    # 用户端：地址栏保持 /user/，内部改写回后端既有的 /aioa/h5/
    location = /user {
        return 302 /user/;
    }
    location /user/ {
        rewrite ^/user/(.*)$ /aioa/h5/$1 break;
        proxy_pass http://aioa_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------- 单端口后端（同源）
    # /aioa/ 覆盖 /aioa/h5、/aioa/web、/aioa/api 三种前缀；**不要只反代 /api/**
    location /aioa/ {
        proxy_pass http://aioa_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 旧口径根前缀（H5 在 /user 下推到的是 /api；既有探活脚本也打这里）
    location /api/ {
        proxy_pass http://aioa_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------ SSE（流式）
    # 必须关缓冲，否则「边生成边显示」会变成「攒完一次性返回」。
    # 正则 location 优先级高于前缀 location，所以位置不影响匹配；
    # 同时覆盖 /api/... 与 /aioa/api/... 两种写法。
    location ~ ^/(?:aioa/)?api/v1/runs/[^/]+/events$ {
        proxy_pass http://aioa_server;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering     off;
        proxy_cache         off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --------------------------------------------------------------- 探活
    # 给前置负载/网关用；与后端 /actuator/health 解耦，避免后端未就绪时入口被判死。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /internal/** 故意不暴露（仅容器内网可达）
}
