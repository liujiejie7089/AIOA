server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退（shell 主应用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子应用静态资源（独立 SPA，各自回退）
    location /subapps/demo-ticket/ {
        alias /usr/share/nginx/html/subapps/demo-ticket/;
        try_files $uri $uri/ /subapps/demo-ticket/index.html;
    }
    location /subapps/demo-dispatch/ {
        alias /usr/share/nginx/html/subapps/demo-dispatch/;
        try_files $uri $uri/ /subapps/demo-dispatch/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
