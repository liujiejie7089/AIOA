# ============================================================================
# ⚠️ 历史档（DEAD）—— 本文件是**已删除的 `aioa-web` 容器内部**的 nginx 配置。
#    自 docs/33 单端口改造后：管理端静态已打进 aioa-server 镜像的 /app/web，
#    由后端直接托管（/aioa/web/**），**不存在 aioa-web 容器**，故本文件已无任何挂载点。
#    仅作历史留存（说明「管理端 / 与 /subapps/* 如何各自 SPA 回退」），请勿再挂载使用。
# ============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退（shell 主应用）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 子应用静态资源（独立 SPA，各自回退）
    location /subapps/demo-ticket/ {
        alias /usr/share/nginx/html/subapps/demo-ticket/;
        try_files $uri $uri/ /subapps/demo-ticket/index.html;
    }
    location /subapps/demo-dispatch/ {
        alias /usr/share/nginx/html/subapps/demo-dispatch/;
        try_files $uri $uri/ /subapps/demo-dispatch/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
