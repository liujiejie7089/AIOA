# ============================================================================
# ⚠️ 历史档（HISTORICAL）—— 自 docs/33 单端口改造后不再参与部署（compose 已无 nginx 服务）。
#    保留作「自有前置 nginx 反代 :8080」的参考；SSE 的 `proxy_buffering off` 仍是要点。
#    ⚠️ 注意：现在 aioa-server 的接口既在根 /api/**（旧口径），也在 /aioa/api/**（新口径）。
#       若你反代，请让「/api/」与「/aioa/」都指到 http://<server>:8080/，不要只反代 /api/。
# ----------------------------------------------------------------------------
# 用户端(80) 与 管理端(81) **共用**的 API 反代 location 组
#
# 由 deploy/nginx/nginx.conf 的两个 server 块分别 `include /etc/nginx/api-proxy.conf`。
# 抽出来的唯一目的：两个端口必须行为一致 —— 否则「改了 80 忘了 81」这种漂移，
# 表现为「用户端正常、管理端所有接口 502」，排查成本很高。
#
# 约束：本文件**只能放 location 块**。不要放 server{} / http{} 级指令（include 在 server 内）。
# ============================================================================

# 业务 API（管理端 axios baseURL='/api/v1'；H5 用相对路径 /api ⇒ 两者同源，
# 都无需任何前端环境变量，换 IP / 域名 / 端口都不用重新构建前端）
location /api/ {
    proxy_pass http://aioa_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SSE 专用：必须关闭缓冲，否则流式变成「攒完一次性返回」。
# nginx 先记最长前缀匹配(/api/)，再按顺序试正则 —— 正则命中即覆盖前缀匹配，
# 所以本块的书写位置不影响优先级。
location ~ ^/api/v1/runs/[^/]+/events$ {
    proxy_pass http://aioa_server;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 开放 API（M4，对外）
location /openapi/ {
    proxy_pass http://aioa_server;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 注意：/internal/** 故意不暴露，仅容器内网可达
