# =============================================================================
# Java 后端（aios-boot）
#
# 两个要点：
#  1. Flyway 迁移在启动时执行，首次冷启动可能超过 60s —— readinessProbe 必须给足
#     initialDelaySeconds，否则会被反复重启、迁移跑到一半。
#  2. 有状态的部分只有 uploads（挂载 PVC）；会话与业务真值都在 MySQL/Redis，
#     因此**可以水平扩容**，但回填类迁移要按单副本发布。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-server
  namespace: aios
  labels:
    app: aios-server
spec:
  replicas: 1
  # 迁移期间禁止并行：滚动会同时起两个实例抢同一把 Flyway 锁
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aios-server
  template:
    metadata:
      labels:
        app: aios-server
    spec:
      containers:
        - name: server
          image: aios/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aios-config
            - secretRef:
                name: aios-secrets
          env:
            - name: AIOS_MCP_HUB_URL
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: AIOS_MCP_HUB_URL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/$(MYSQL_DB)?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: MYSQL_PASSWORD
            - name: AIOS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: JWT_SECRET
            - name: AIOS_SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: SERVICE_JWT_SECRET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: MINIO_ROOT_USER
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits:   { cpu: "2", memory: "4Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60      # 首次迁移可能很慢
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 180
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: aios-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: aios-server
  namespace: aios
spec:
  selector:
    app: aios-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
