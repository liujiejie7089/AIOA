# =============================================================================
# Python Agent 服务（FastAPI）
#
# 一个必须知道的坑：多任务计划执行的**幂等回放缓存放在进程内存里**
# （见 docs/adr/ADR-004-计划执行按run_id幂等回放.md）。多副本时，SSE 断线重连若
# 打到另一个副本，会命中不到缓存而把整份计划再跑一遍。
#   → 扩容到 2 副本以上之前，先把帧缓存换成共享存储（Redis），
#     或在 Ingress 上开启会话亲和（session affinity）作为过渡。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aios-agent
  namespace: aios
  labels:
    app: aios-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aios-agent
  template:
    metadata:
      labels:
        app: aios-agent
    spec:
      containers:
        - name: agent
          image: aios/agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          volumeMounts:
            # ★ ASR 模型（只读）：容器内 /app/.models 必须含 <模型名>/（默认 small/，
            #   即 model.bin / config.json / tokenizer.json / vocabulary.txt）。镜像**不含**模型
            #   （约 483MB，被 .gitignore 忽略）⇒ 必须由节点预置，否则语音识别直接 503。
            #   ⚠️ 目录缺失时会被建成空目录 ⇒ ASR 静默不可用（H5 麦克风置灰）；
            #      Pod 若落到没有该模型的节点上同样不可用 —— replicas=1 时请配合 nodeSelector，
            #      或把下面的 hostPath 换成已预置模型的 PVC（写法参考 00-namespace-config.yaml 的 aios-uploads）。
            - name: asr-models
              mountPath: /app/.models
              readOnly: true
          envFrom:
            - configMapRef:
                name: aios-config
            - secretRef:
                name: aios-secrets
          env:
            - name: AIOS_SERVER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: SERVER_BASE_URL
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aios-secrets
                  key: SERVICE_JWT_SECRET
            # MCP 网关开关（代码默认 false）。不设 ⇒ 永不发 manifest、永不注入 mcp__* 工具。
            - name: AIOS_MCP_HUB
              valueFrom:
                configMapKeyRef:
                  name: aios-config
                  key: AIOS_MCP_HUB
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        # ★ ASR 模型目录（节点路径）。必须含 <模型名>/（默认 small/）那 4 个文件，约 483MB。
        #   与 deploy/docker-compose.yml 的 agent.volumes 同义（那边默认 ../agent/.models）。
        #   ⚠️ 刻意用 DirectoryOrCreate 而不是 Directory：缺目录时建空目录即可 ——
        #      若用 Directory，模型缺失会让**整个 agent** 起不来，连普通对话一起挂掉。
        #      ASR 到底可不可用，以 /internal/v1/asr/status 的 available 为准（H5 也会据此置灰麦克风）。
        - name: asr-models
          hostPath:
            path: /opt/aios/asr-models
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: aios-agent
  namespace: aios
spec:
  selector:
    app: aios-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
