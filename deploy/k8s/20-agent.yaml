# =============================================================================
# Python Agent 服务（FastAPI）
#
# 一个必须知道的坑：多任务计划执行的**幂等回放缓存放在进程内存里**
# （见 docs/adr/ADR-004-计划执行按run_id幂等回放.md）。多副本时，SSE 断线重连若
# 打到另一个副本，会命中不到缓存而把整份计划再跑一遍。
#   → 扩容到 2 副本以上之前，先把帧缓存换成共享存储（Redis），
#     或在 Ingress 上开启会话亲和（session affinity）作为过渡。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aioa-agent
  namespace: aioa
  labels:
    app: aioa-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aioa-agent
  template:
    metadata:
      labels:
        app: aioa-agent
    spec:
      containers:
        - name: agent
          image: aioa/agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aioa-config
            - secretRef:
                name: aioa-secrets
          env:
            - name: AIOA_SERVER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: aioa-config
                  key: SERVER_BASE_URL
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aioa-secrets
                  key: SERVICE_JWT_SECRET
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aioa-agent
  namespace: aioa
spec:
  selector:
    app: aioa-agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
