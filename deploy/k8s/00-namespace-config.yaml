# =============================================================================
# 命名空间 / 非敏感配置 / 密钥样例
#
# 与 deploy/docker-compose.yml 使用同一套环境变量名，迁移时只需把它们搬到
# ConfigMap（非敏感）与 Secret（敏感）两处。
#
# 注意：Secret 这里是**样例**，真实值请用
#   kubectl create secret generic aios-secrets --from-literal=... -n aios
# 或在集群里接入外部密钥管理（Vault / 云厂商 KMS），不要把明文提交进仓库。
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aios
  labels:
    app.kubernetes.io/part-of: aios
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aios-config
  namespace: aios
data:
  # ---- 数据库 / Redis（集群外或同集群 StatefulSet 均可，改这里即可）----
  MYSQL_HOST: "192.168.31.129"
  MYSQL_PORT: "3306"
  MYSQL_DB: "aios"
  MYSQL_USER: "root"
  REDIS_HOST: "192.168.31.129"
  REDIS_PORT: "6379"

  # ---- 服务间地址（集群内用 Service 名）----
  AIOS_AGENT_BASE_URL: "http://aios-agent:8000"
  SERVER_BASE_URL: "http://aios-server:8080"

  # ---- MCP 网关（内置连接器工具：QQ邮箱 / 企业微信）----
  # AIOS_MCP_HUB 是 agent 侧开关，代码默认 false ⇒ 不设则永不注入 mcp__* 工具（静默失效）。
  # URL 给 server 探活用；集群内必须用 Service 名（Pod 的 127.0.0.1 是它自己）。
  AIOS_MCP_HUB: "true"
  AIOS_MCP_HUB_URL: "http://aios-mcp-hub:8099"
  MCP_HUB_SERVER_BASE_URL: "http://aios-server:8080"

  # ---- 对象存储 ----
  MINIO_ENDPOINT: "http://aios-minio:9000"
  MINIO_ROOT_USER: "aios"

  # ---- 知识库存储后端 ----
  # mysql（默认，零新增依赖）/ milvus（需同时 apply 40-milvus.yaml）
  # ⚠️ 改成 milvus 时 **Milvus 必须在线**，否则 server 启动失败（决策 D6 fail-fast，不静默降级）
  AIOS_KB_STORE: "mysql"
  # ---- 知识库嵌入（换成语义向量才谈得上检索质量；local 是 256 维 n-gram 哈希，无语义）----
  AIOS_KB_EMBEDDING_PROVIDER: "local"
  AIOS_KB_EMBEDDING_FORMAT: "ollama"
  AIOS_KB_EMBEDDING_URL: ""                # 例 http://ollama:11434/api/embeddings
  AIOS_KB_EMBEDDING_MODEL: "bge-small-zh-v1.5"
  AIOS_KB_EMBEDDING_DIMS: "512"            # 必须与 AIOS_MILVUS_DIMS 一致
  AIOS_KB_EMBEDDING_TIMEOUT_MS: "15000"
  AIOS_KB_REEMBED_ON_START: "false"        # 换 provider/模型后跑一次 true，补齐切片向量
  # ---- Milvus（服务名与 40-milvus.yaml 一致）----
  AIOS_MILVUS_URI: "http://milvus:19530"
  AIOS_MILVUS_DATABASE: "default"
  AIOS_MILVUS_COLLECTION: "kb_chunk_v1"    # 维度创建后不可改；换嵌入模型必须换集合名再回填
  AIOS_MILVUS_DIMS: "512"
  AIOS_MILVUS_METRIC: "COSINE"
  AIOS_MILVUS_INDEX: "HNSW"
  AIOS_MILVUS_HNSW_M: "16"
  AIOS_MILVUS_HNSW_EF: "200"
  AIOS_MILVUS_ENABLE_BM25: "true"          # 稀疏向量 + 原生混合检索
  AIOS_MILVUS_BACKFILL: "false"            # 一次性 true：从 MySQL kb_chunk 重建索引
  AIOS_MILVUS_TIMEOUT_MS: "10000"
  AIOS_MILVUS_BATCH: "200"

  # ---- 模型 ----
  MODEL_DEFAULT: "echo"

  # ---- HITL（人工介入：ask_user 澄清 + request_form 自定义表单）----
  # ⚠️ 必须显式为 true：agent 的 config.py 默认 False，而 .env 被 .dockerignore 排除进不了镜像。
  #   为 false 时 ask_user / request_form **不会进模型工具表**，数字人只会输出操作步骤、
  #   永远不弹自定义表单（这正是「数字人不调用自定义表单」的根因）。
  #   验：aios-agent 日志出现 `tools=9`（为 7 即未生效）、`HITL enabled: checkpoint kind=...`。
  AIOS_HITL: "true"
  # HITL 挂起态存储。留空 = 进程内存：Pod 重启/漂移到别的副本后取不到挂起状态，
  # 用户回填表单或澄清会「无法恢复」。生产建议 Redis Stack（本集群已有 REDIS_HOST）。
  # 例：redis://192.168.31.129:6379/0
  AIOS_CHECKPOINT_URL: ""

  # ---- 语音识别（ASR）----
  # 模型**不进镜像**（约 483MB，被 .gitignore 忽略）⇒ 必须由节点 / 共享存储提供，
  # 见 20-agent.yaml 的 asr-models 卷（挂到容器 /app/.models，其下须有 <模型名>/，默认 small/）。
  # 缺了会怎样：语音接口 503（ASR_UNAVAILABLE），H5 麦克风置灰并提示「语音识别服务暂不可用」。
  # 验：curl -s http://aios-agent:8000/internal/v1/asr/status   → "available": true
  AIOS_ASR_MODEL_DIR: "/app/.models"
  AIOS_ASR_MODEL: "small"
  AIOS_ASR_ALLOW_DOWNLOAD: "0"             # 集群无外网：保持 0（离线加载，不联网下载）

  # ---- 代码托管方 ----
  AIOS_REPO_PROVIDER: "gitee"
  AIOS_GITEE_ENABLED: "true"
  AIOS_GITEE_BASE_URL: "https://gitee.com/api/v5"
  AIOS_GITEE_WEB_URL: "https://gitee.com"
  AIOS_GITEE_OAUTH_AUTHORIZE_URL: "https://gitee.com"
  AIOS_GITEE_REDIRECT_URI: "https://aios.example.com/api/v1/gitee/bind/callback"
  AIOS_GITEE_SCOPE: "user_info projects hook pull_requests issues notes"
  AIOS_GITEA_ENABLED: "false"

  TZ: "Asia/Shanghai"
---
# 样例：真实部署请用 kubectl create secret 生成，勿提交明文
apiVersion: v1
kind: Secret
metadata:
  name: aios-secrets
  namespace: aios
type: Opaque
stringData:
  MYSQL_PASSWORD: "change-me"
  JWT_SECRET: "change-me-jwt-secret-at-least-32-bytes-long"
  SERVICE_JWT_SECRET: "change-me-service-secret-at-least-32-bytes"
  MINIO_ROOT_PASSWORD: "change-me"
  DEEPSEEK_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  AIOS_GITEE_CLIENT_ID: ""
  AIOS_GITEE_CLIENT_SECRET: ""
  AIOS_GITEE_WEBHOOK_SECRET: ""
  AIOS_GITEE_TOKEN_ENC_KEY: "change-me"
  # 走 http 嵌入时可选（vLLM 网关常需）；留空即不发送 Authorization 头
  AIOS_KB_EMBEDDING_API_KEY: ""
  # Milvus 单机默认不鉴权，留空即可；接入鉴权的托管实例时填 <user>:<password>
  AIOS_MILVUS_TOKEN: ""
---
# 上传文件与知识库原文：多副本时必须用 ReadWriteMany 存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aios-uploads
  namespace: aios
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
