# =============================================================================
# AIOA 一键部署（生产可用）
# - 数据库 / Redis / Milvus / MinIO：**都在外部主机、不由本 compose 托管**，地址由 .env 注入
#     MySQL = 10.0.0.5:13049（库 aioa / 账号 aioa）　Redis = 10.0.0.7:6379
#     Milvus = 10.0.0.12:19530（无鉴权）
#     MinIO = 别处有（172.16.8.249:9000）但**应用代码根本不读它**，见文件内注释 ⇒ 不需要接、不需要搬镜像
#     （下面 `${MYSQL_HOST:-…}` 的默认值只是「没传 .env 时的兜底」，**部署时必须用 .env 覆盖**；
#      默认值已与本次环境对齐，但真实口令不在默认值里）
# - 公网入口两种走法：
#     (A) 用自带 nginx：**80 = 用户端 H5**、**81 = 管理端**；server/agent/web 在 aioa-net 内互访、不对外
#     (B) 不用边缘 nginx（目标机 10.0.0.12 本次采用）：叠加 `docker-compose.backend.yml`，
#         把 server:8080 / agent:8000 发布到宿主，由**宿主已有的 nginx** 反代 /api/
#         ⇒ 此走法只需 aioa-server + aioa-agent 两个镜像
# - 健康检查 + 重启策略 + 日志轮转 + 资源限制 齐备
#
# 起停（在 deploy/ 目录）：
#     cp .env.production .env && vim .env      # 填密钥；.env 已被 gitignore
#     docker compose up -d --build             # (A) 默认档
#     docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d server agent   # (B) 只起后端
#     docker compose --profile model up -d     # 额外起 ollama（KB 用 http 嵌入 / 本地模型）
#   详见 `deploy/生产部署手册.md`。
# =============================================================================

name: aioa

# 数据库（MySQL 8）与 Redis 7 都在**外部主机**，由下方 server 的 SPRING_DATASOURCE_* /
# SPRING_DATA_REDIS_HOST 环境变量直连，compose 内不再托管：
#   MySQL = 10.0.0.5:13049（库 aioa / 账号 aioa，**非默认端口**）　Redis = 10.0.0.7:6379（**有口令**）
# 如需本地临时起一个 MySQL 调试，可取消下方注释：
# mysql:
#   image: mysql:8.0
#   container_name: aioa-mysql
#   environment:
#     MYSQL_DATABASE: ${MYSQL_DB:-aioa}
#     MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-}
#     TZ: Asia/Shanghai
#   command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
#   expose: ["3306"]
#   healthcheck:
#     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
#     interval: 5s
#     timeout: 3s
#     retries: 20
#   restart: unless-stopped
#   logging:
#     driver: json-file
#     options: { max-size: "100m", max-file: "5" }
#   networks: [aioa-net]
#   mem_limit: 4g

# redis:
#   image: redis:7-alpine
#   container_name: aioa-redis
#   command: ["redis-server", "--appendonly", "yes"]
#   expose: ["6379"]
#   healthcheck:
#     test: ["CMD", "redis-cli", "ping"]
#     interval: 5s
#     timeout: 3s
#     retries: 20
#   restart: unless-stopped
#   logging:
#     driver: json-file
#     options: { max-size: "100m", max-file: "5" }
#   networks: [aioa-net]
#   mem_limit: 512m

services:

  # ===========================================================================
  # MinIO（**可选，默认不启动**：profile=minio）
  # ---------------------------------------------------------------------------
  # ⚠️ 事实核对（2026-09-21 全仓 grep 验证）：**应用代码根本不使用 MinIO**。
  #     全部 Java / Python / 前端源码里没有 `minio` 字样，也没有 S3 客户端
  #     （无 `S3Client` / `amazonaws` / OSS SDK 依赖）。
  #     文件上传走的是 **本地磁盘**：`FileController` 的 `@Value("${aioa.upload.dir:./uploads}")`
  #     + 元数据落 `sys_file` 表。所以本服务与下方 `MINIO_*` 三个环境变量都是**历史遗留**，
  #     一起起它只是白占 2G 内存与一个端口。
  # ⇒ 因此把它归到 `profile: [minio]`：`docker compose up -d` **不会**再带起它；
  #    只有显式 `--profile minio` 才会起（用于将来真接入对象存储时）。
  #    目标机若已在别处有 MinIO（如 172.16.8.249:9001），**与本服务无关，不用接**。
  # ===========================================================================
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: aioa-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aioa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aioa_dev_minio}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
    ports:
      # 仅控制台端口暴露，且**用 9011 而不是 9001** —— 生产机上 milvus-minio 已占用
      # 9000/9001，直接映射会 `port is already allocated`。数据端口 9000 只在 aioa-net 内可达。
      - "9011:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }
    networks: [aioa-net]
    mem_limit: 2g
    cpus: "1"

  # ===========================================================================
  # Server（Java 后端，仅容器内可达，通过 nginx 出去）
  # ===========================================================================
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: aioa-server
    environment:
      # ---- 数据库 / Redis ----
      # createDatabaseIfNotExist=true：全新机器上不必手工建库（账号需有 CREATE 权限）
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-10.0.0.5}:${MYSQL_PORT:-13049}/${MYSQL_DB:-aioa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-aioa}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-}
      # 两个键名都传：application.yml 显式写了 ${SPRING_REDIS_HOST:…}，
      # 而 Spring Boot 的宽松绑定认 SPRING_DATA_REDIS_HOST —— 少传一个都可能连错 Redis。
      SPRING_REDIS_HOST: ${REDIS_HOST:-10.0.0.7}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:-}
      SPRING_REDIS_DATABASE: ${SPRING_REDIS_DATABASE:-0}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-10.0.0.7}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}

      # ---- JWT 密钥 ----
      AIOA_JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-at-least-32-bytes-long}
      AIOA_SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret-at-least-32-bytes}

      # ---- Agent / MinIO ----
      AIOA_AGENT_BASE_URL: http://agent:8000
      # ⚠️ 下面三个 MINIO_* 键**当前无人读取**（全仓无 MinIO/S3 客户端；文件落本地盘）。
      #    默认值故意留空 —— 不给一个「看起来已经接上了」的 IP 暗示。真想启用对象存储时，
      #    在 .env 里填 MINIO_ENDPOINT/ACCESS_KEY/SECRET_KEY，**并同时**给应用侧补 S3 客户端。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}

      # ---- 文件上传落盘目录（**这个是真正在用的**）----
      # FileController 默认 ./uploads（= 容器内 /app/uploads，Dockerfile.server 的 WORKDIR）。
      # 必须挂卷，否则容器重建一次上传的文件全丢，而 sys_file 记录还在 ⇒ 下载 404。
      AIOA_UPLOAD_DIR: /app/uploads

      # ---- 知识库存储与嵌入（docs/32 向量库 Milvus）----
      # 默认 mysql（零新增依赖）。目标机 10.0.0.12 上**已有** milvus-standalone ⇒
      # 本部署用 .env 的 AIOA_KB_STORE=milvus + AIOA_MILVUS_URI=http://10.0.0.12:19530
      # 指向那台**现成实例**，此时**不要**加 `--profile milvus`
      # （本 compose 自带的那套会与现成的 19530/9091 端口冲突而启动失败）。
      # 只有目标机没有 Milvus 时，才用 `--profile milvus` 起文末那套自带栈。
      # 两种走法下，Milvus 不可达 server 都会**启动失败**（决策 D6 fail-fast，不静默降级为空结果）。
      AIOA_KB_STORE: ${AIOA_KB_STORE:-mysql}
      AIOA_KB_EMBEDDING_PROVIDER: ${AIOA_KB_EMBEDDING_PROVIDER:-local}
      AIOA_KB_EMBEDDING_FORMAT: ${AIOA_KB_EMBEDDING_FORMAT:-ollama}
      # 容器内互访：Ollama 走 ollama:11434，vLLM 走 vllm:8000
      AIOA_KB_EMBEDDING_URL: ${AIOA_KB_EMBEDDING_URL:-http://ollama:11434/api/embeddings}
      AIOA_KB_EMBEDDING_MODEL: ${AIOA_KB_EMBEDDING_MODEL:-bge-small-zh-v1.5}
      AIOA_KB_EMBEDDING_DIMS: ${AIOA_KB_EMBEDDING_DIMS:-512}
      AIOA_KB_EMBEDDING_TIMEOUT_MS: ${AIOA_KB_EMBEDDING_TIMEOUT_MS:-15000}
      AIOA_KB_EMBEDDING_API_KEY: ${AIOA_KB_EMBEDDING_API_KEY:-}
      # 换 provider / 换模型后置 true 跑一次全量重算（幂等），跑完记得改回 false
      AIOA_KB_REEMBED_ON_START: ${AIOA_KB_REEMBED_ON_START:-false}
      # 容器内 Milvus 地址固定为 http://milvus:19530（compose 网络内）
      AIOA_MILVUS_URI: ${AIOA_MILVUS_URI:-http://milvus:19530}
      AIOA_MILVUS_TOKEN: ${AIOA_MILVUS_TOKEN:-}
      AIOA_MILVUS_DATABASE: ${AIOA_MILVUS_DATABASE:-default}
      AIOA_MILVUS_COLLECTION: ${AIOA_MILVUS_COLLECTION:-kb_chunk_v1}
      AIOA_MILVUS_DIMS: ${AIOA_MILVUS_DIMS:-512}
      AIOA_MILVUS_METRIC: ${AIOA_MILVUS_METRIC:-COSINE}
      AIOA_MILVUS_INDEX: ${AIOA_MILVUS_INDEX:-HNSW}
      AIOA_MILVUS_HNSW_M: ${AIOA_MILVUS_HNSW_M:-16}
      AIOA_MILVUS_HNSW_EF: ${AIOA_MILVUS_HNSW_EF:-200}
      AIOA_MILVUS_ENABLE_BM25: ${AIOA_MILVUS_ENABLE_BM25:-true}
      # 首次接入 / 索引损坏后置 true 从 kb_chunk 全量回填，跑完改回 false
      AIOA_MILVUS_BACKFILL: ${AIOA_MILVUS_BACKFILL:-false}
      AIOA_MILVUS_TIMEOUT_MS: ${AIOA_MILVUS_TIMEOUT_MS:-10000}
      AIOA_MILVUS_BATCH: ${AIOA_MILVUS_BATCH:-200}

      # ---- 代码托管方 ----
      AIOA_REPO_PROVIDER: ${AIOA_REPO_PROVIDER:-gitee}

      # ---- Gitee ----
      AIOA_GITEE_ENABLED: ${AIOA_GITEE_ENABLED:-true}
      AIOA_GITEE_BASE_URL: ${AIOA_GITEE_BASE_URL:-https://gitee.com/api/v5}
      AIOA_GITEE_WEB_URL: ${AIOA_GITEE_WEB_URL:-https://gitee.com}
      AIOA_GITEE_OAUTH_AUTHORIZE_URL: ${AIOA_GITEE_OAUTH_AUTHORIZE_URL:-https://gitee.com}
      AIOA_GITEE_CLIENT_ID: ${AIOA_GITEE_CLIENT_ID:-}
      AIOA_GITEE_CLIENT_SECRET: ${AIOA_GITEE_CLIENT_SECRET:-}
      AIOA_GITEE_REDIRECT_URI: ${AIOA_GITEE_REDIRECT_URI:-http://localhost/api/v1/gitee/bind/callback}
      AIOA_GITEE_SCOPE: ${AIOA_GITEE_SCOPE:-user_info projects hook pull_requests issues notes}
      AIOA_GITEE_ORG: ${AIOA_GITEE_ORG:-}
      AIOA_GITEE_WEBHOOK_BASE_URL: ${AIOA_GITEE_WEBHOOK_BASE_URL:-}
      AIOA_GITEE_WEBHOOK_SECRET: ${AIOA_GITEE_WEBHOOK_SECRET:-}
      AIOA_GITEE_TOKEN_ENC_KEY: ${AIOA_GITEE_TOKEN_ENC_KEY:-aioa-dev-gitee-token-key-please-change}
      AIOA_GITEE_BIND_RETURN_URL: ${AIOA_GITEE_BIND_RETURN_URL:-http://localhost/}

      # ---- Gitea ----
      AIOA_GITEA_ENABLED: ${AIOA_GITEA_ENABLED:-false}
      AIOA_GITEA_BASE_URL: ${AIOA_GITEA_BASE_URL:-}
      AIOA_GITEA_WEB_URL: ${AIOA_GITEA_WEB_URL:-}
      AIOA_GITEA_OAUTH_AUTHORIZE_URL: ${AIOA_GITEA_OAUTH_AUTHORIZE_URL:-}
      AIOA_GITEA_CLIENT_ID: ${AIOA_GITEA_CLIENT_ID:-}
      AIOA_GITEA_CLIENT_SECRET: ${AIOA_GITEA_CLIENT_SECRET:-}
      AIOA_GITEA_REDIRECT_URI: ${AIOA_GITEA_REDIRECT_URI:-http://localhost/api/v1/gitea/bind/callback}
      AIOA_GITEA_SCOPE: ${AIOA_GITEA_SCOPE:-repo read:organization notification issue}
      AIOA_GITEA_ORG: ${AIOA_GITEA_ORG:-}
      AIOA_GITEA_WEBHOOK_BASE_URL: ${AIOA_GITEA_WEBHOOK_BASE_URL:-}
      AIOA_GITEA_WEBHOOK_SECRET: ${AIOA_GITEA_WEBHOOK_SECRET:-}
      AIOA_GITEA_TOKEN_ENC_KEY: ${AIOA_GITEA_TOKEN_ENC_KEY:-aioa-dev-gitea-token-key-please-change}
      AIOA_GITEA_REPO_NAME_SOURCE: ${AIOA_GITEA_REPO_NAME_SOURCE:-AUTO}

      TZ: Asia/Shanghai
    expose:
      - "8080"
    volumes:
      # 上传文件落盘目录（对齐上面的 AIOA_UPLOAD_DIR）。不挂卷 = 容器重建即丢文件。
      - serveruploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      # 首次冷启动 + Flyway 迁移（V1–V58）可能超过 60s，给到 3 分钟兜底
      start_period: 180s
    # 注意：**不要**再写 `depends_on: minio(healthy)`。应用代码不用 MinIO（见上方注释），
    # 一旦保留它会强制把可选的 minio 服务拉起来，且 minio 拉不到镜像时 server 直接起不来。
    # MySQL / Redis / Milvus 都在外部主机，本 compose 无从「等待」，靠 server 自身重试 + 健康检查兜底。
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "200m", max-file: "10" }
    networks: [aioa-net]
    mem_limit: 4g
    cpus: "2"

  # ===========================================================================
  # Agent（Python AI 服务，仅容器内可达）
  # ===========================================================================
  agent:
    build:
      context: ../agent
      dockerfile: ../deploy/Dockerfile.agent
    container_name: aioa-agent
    environment:
      AIOA_SERVER_BASE_URL: http://server:8080
      AIOA_SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret-at-least-32-bytes}
      MODEL_DEFAULT: ${MODEL_DEFAULT:-echo}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      # 模型网关按 `{KEY}_BASE_URL` / `{KEY}_API_KEY` 读取
      # （key ∈ echo|minimax|deepseek|dashscope|vllm|ollama，管理端新增的模型按其 providerKey 读取）。
      # ⚠️ 本地 provider 的 API Key 必须给**非空占位**，否则网关判定「缺 key」并静默降级 echo。
      # ⚠️ 基址是 OpenAI 兼容基址，Ollama 必须带 `/v1`。
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      # M1 骨架 agent 为回声模型，不直连数据库；后续如需持久化（如 LangGraph checkpointer）
      # 复用统一 MySQL，DSN 形如：
      # AIOA_MYSQL_DSN: mysql://${MYSQL_USER:-aioa}:${MYSQL_PASSWORD:-}@${MYSQL_HOST:-10.0.0.5}:${MYSQL_PORT:-13049}/${MYSQL_DB:-aioa}
      TZ: Asia/Shanghai
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }
    networks: [aioa-net]
    mem_limit: 2g
    cpus: "1"

  # ===========================================================================
  # Web（前端静态资源，仅容器内可达；走 nginx 出去）
  # ===========================================================================
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: aioa-web
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [aioa-net]
    mem_limit: 256m
    cpus: "0.5"

  # ===========================================================================
  # Nginx（对外两个端口：80 = 用户端 H5 / 81 = 管理端；
  #        HTTPS 由前置 Nginx / 宝塔 / Cloudflare 处理）
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: aioa-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 80 与 81 两个 server 块**共用**的 API 反代 location 组。
      # 抽成单独文件是为了避免「改了一个端口忘了另一个」——两端口必须行为一致。
      - ./nginx/api-proxy.conf:/etc/nginx/api-proxy.conf:ro
      # 用户端 H5：单文件应用，直接以静态文件挂进来，由本 nginx 在 **80** 端口提供
      # （H5 内部调相对路径 /api，同源下无需任何前端配置）
      - ../user-client/index.html:/usr/share/nginx/html/h5/index.html:ro
    ports:
      - "80:80"    # 用户端 H5（对外主入口）
      - "81:81"    # 管理端 shell
      # HTTPS 若要在本容器终止，把证书挂到 /etc/nginx/certs/ 并在 nginx.conf 加 listen 443
      # 建议由宝塔前置 Nginx / Cloudflare 统一终止 HTTPS，避免在应用层重复签发
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [aioa-net]
    mem_limit: 256m
    cpus: "0.5"

  # ===========================================================================
  # 可选：本地模型（profile=model）
  #   - vllm：要 GPU 与大磁盘，**只在你真要用本地大模型时**才开（--profile model）
  #   - ollama：知识库走 http 语义嵌入时**必须**有它（镜像与模型都很小），
  #     它同时挂了 `ollama` 专有 profile ⇒ 可以只起它、不连带拉 vllm 的大镜像：
  #         docker compose --profile ollama up -d
  # ===========================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: aioa-vllm
    profiles: ["model"]
    command: ["--model", "${LOCAL_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}", "--served-model-name", "local-vllm"]
    volumes:
      - hfcache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    # GPU 环境取消注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks: [aioa-net]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  ollama:
    image: ollama/ollama:latest
    container_name: aioa-ollama
    # 两个 profile：`model` 保持既有语义（连同 vllm 一起起），`ollama` 用于「只要嵌入服务」的场景
    profiles: ["model", "ollama"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    networks: [aioa-net]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }

  # ===========================================================================
  # 可选：向量库 Milvus 栈（profile=milvus，docs/32）
  #
  # ⚠️ 本部署（10.0.0.12）**不用这一段** —— 该机已有 milvus-standalone，
  #    走 .env 的 AIOA_MILVUS_URI=http://10.0.0.12:19530 复用现成实例；
  #    加了 `--profile milvus` 会因 19530/9091 端口被占而启动失败。
  #
  # 启用（server 的 AIOA_KB_STORE 必须同时为 milvus，否则 server **启动失败**——决策 D6 fail-fast）：
  #   AIOA_KB_STORE=milvus docker compose --profile milvus up -d
  # 首次接入 / 索引损坏后重建（跑完把开关改回 false 并重启 server）：
  #   AIOA_KB_STORE=milvus AIOA_MILVUS_BACKFILL=true docker compose --profile milvus up -d
  #
  # 组成（与 Milvus 官方 standalone compose 逐项对齐，未自创环境变量）：
  #   etcd（元数据）+ milvus-minio（段文件/对象存储）+ milvus-standalone。
  # 有意**不复用**上面的 aioa-minio：官方镜像假定 minioadmin/minioadmin 凭据，
  # 复用业务 MinIO 需要额外对齐 access key，且业务文件与向量段文件混在一个桶里；
  # 独立的 milvus-minio 只在 profile 打开时才存在，代价很小、确定性更高。
  #
  # 运维界面用 Milvus 自带的 WebUI（无需额外镜像）：http://<host>:9091/webui/
  #
  # 重启丢卷也不要紧：索引**随时可从 MySQL kb_chunk 重建**（AIOA_MILVUS_BACKFILL=true）。
  # ===========================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: aioa-etcd
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - etcddata:/etcd
    expose:
      - "2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks: [aioa-net]
    mem_limit: 1g

  # Milvus 专用对象存储（与官方 compose 同版本、同凭据口径）
  milvus-minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: aioa-milvus-minio
    profiles: ["milvus"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    volumes:
      - milvusminiodata:/minio_data
    expose:
      - "9000"
    ports:
      # 控制台另开端口，避免与业务 MinIO 的 9001 冲突
      - "9002:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks: [aioa-net]
    mem_limit: 2g

  milvus:
    # 默认 2.5.x（决策 D3：2.5 起有原生 BM25 Function + hybrid_search；RocksMQ 内嵌，依赖最少）。
    # 若要升 2.6.x：改 MILVUS_IMAGE_TAG 即可（2.6 默认消息队列变 Woodpecker，仍复用同一个 MinIO）。
    # 注意：集合维度创建后不可改，跨大版本升级前先确认集合是否需要重建。
    image: milvusdb/milvus:${MILVUS_IMAGE_TAG:-v2.5.3}
    container_name: aioa-milvus
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
      TZ: Asia/Shanghai
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      # 19530 同时发布到宿主，方便本机 java / pymilvus / CLI 直连调试
      - "19530:19530"
      # 9091 = healthz / metrics / 自带 WebUI（http://<host>:9091/webui/）
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "5" }
    networks: [aioa-net]
    mem_limit: 4g
    cpus: "2"

  # ===========================================================================
  # 可选：观测（profile=ops）
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: aioa-prometheus
    profiles: ["ops"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [aioa-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aioa-grafana
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks: [aioa-net]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: aioa-loki
    profiles: ["ops"]
    ports:
      - "3100:3100"
    networks: [aioa-net]
    restart: unless-stopped

volumes:
  # server 上传文件（/app/uploads）。不声明会随容器重建丢失。
  serveruploads:
  # 仅 profile=minio 时用（默认不起）
  miniodata:
  hfcache:
  ollamadata:
  # Milvus 栈（profile=milvus）——三个都命名卷，避免 compose down 丢索引
  etcddata:
  milvusdata:
  milvusminiodata:

networks:
  aioa-net:
    driver: bridge