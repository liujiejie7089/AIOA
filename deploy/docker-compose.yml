name: aioa

services:
  # 数据库（MySQL 8）与 Redis 7 已迁至远程主机 192.168.31.129，由下方 server/agent 的
  # SPRING_DATASOURCE_* / SPRING_DATA_REDIS_HOST 环境变量直连，compose 内不再托管。
  # 如需本地临时起一个 MySQL 调试，可取消下方注释：
  # mysql:
  #   image: mysql:8.0
  #   container_name: aioa-mysql
  #   environment:
  #     MYSQL_DATABASE: ${MYSQL_DB:-aioa}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-yjiud}
  #     TZ: Asia/Shanghai
  #   command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  #   ports: ["3306:3306"]
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #   networks: [aioa-net]

  # redis:
  #   image: redis:7-alpine
  #   container_name: aioa-redis
  #   command: ["redis-server", "--appendonly", "yes"]
  #   ports: ["6379:6379"]
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20
  #   networks: [aioa-net]

  minio:
    image: minio/minio:latest
    container_name: aioa-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aioa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aioa_dev_minio}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [aioa-net]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: aioa-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-192.168.31.129}:${MYSQL_PORT:-3306}/${MYSQL_DB:-aioa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-yjiud}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-192.168.31.129}
      SPRING_DATA_REDIS_PORT: "6379"
      AIOA_JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-at-least-32-bytes-long}
      AIOA_SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret-at-least-32-bytes}
      AIOA_AGENT_BASE_URL: http://agent:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aioa}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aioa_dev_minio}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [aioa-net]

  agent:
    build:
      context: ../agent
      dockerfile: ../deploy/Dockerfile.agent
    container_name: aioa-agent
    environment:
      AIOA_SERVER_BASE_URL: http://server:8080
      AIOA_SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-change-me-service-secret-at-least-32-bytes}
      MODEL_DEFAULT: ${MODEL_DEFAULT:-echo}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LOCAL_VLLM_BASE_URL: ${LOCAL_VLLM_BASE_URL:-http://vllm:8000/v1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # M1 骨架 agent 为回声模型，不直连数据库；后续如需持久化（如 LangGraph checkpointer）
      # 复用统一 MySQL，DSN 形如：
      # AIOA_MYSQL_DSN: mysql://${MYSQL_USER:-root}:${MYSQL_PASSWORD:-yjiud}@${MYSQL_HOST:-192.168.31.129}:${MYSQL_PORT:-3306}/${MYSQL_DB:-aioa}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [aioa-net]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: aioa-web
    ports:
      - "8081:80"
    depends_on:
      - server
    networks: [aioa-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: aioa-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks: [aioa-net]

  vllm:
    image: vllm/vllm-openai:latest
    container_name: aioa-vllm
    profiles: ["model"]
    command: ["--model", "${LOCAL_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}", "--served-model-name", "local-vllm"]
    volumes:
      - hfcache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    # GPU 环境取消注释：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks: [aioa-net]

  ollama:
    image: ollama/ollama:latest
    container_name: aioa-ollama
    profiles: ["model"]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    networks: [aioa-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: aioa-prometheus
    profiles: ["ops"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [aioa-net]

  grafana:
    image: grafana/grafana:latest
    container_name: aioa-grafana
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks: [aioa-net]

  loki:
    image: grafana/loki:latest
    container_name: aioa-loki
    profiles: ["ops"]
    ports:
      - "3100:3100"
    networks: [aioa-net]

volumes:
  miniodata:
  hfcache:
  ollamadata:

networks:
  aioa-net:
    driver: bridge
